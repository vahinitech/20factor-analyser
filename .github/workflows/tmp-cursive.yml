# Throwaway (#277): which test reaches two lines on main. Never merged.
name: tmp cursive neat

on:
  push:
    branches: [claude/tmp-cursive-neat]

jobs:
  contexts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        ref: [main, claude/cursive-from-ink-32bc17]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements-core.txt
      - name: Contexts of the two lines
        run: |
          cat > /tmp/rc <<'RC'
          [run]
          branch = True
          source = backend
          dynamic_context = test_function
          RC
          python -m coverage run --rcfile=/tmp/rc -m unittest discover -s backend/tests -t . > /dev/null 2>&1 || true
          python -m coverage json --rcfile=/tmp/rc --show-contexts -o /tmp/c.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/c.json"))["files"]
          for f, lines in (("backend/tbar_analysis.py", ["136"]), ("backend/style_analysis.py", ["161", "171"])):
              ctx = d.get(f, {}).get("contexts", {})
              for ln in lines:
                  print(f, ln, sorted(set(ctx.get(ln, [])))[:20])
          PY
