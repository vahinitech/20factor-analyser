# CI for the 20-Factor Analyser — runs on every push + PR.
#  - python-tests   : server logic without the heavy paddle/torch install.
#  - benchmark      : real handwriting pages replayed; scores as expected.
#  - complexity     : each per-page function grows no faster than declared.
#  - e2e            : headless Chrome — analyser app loads, print/handwriting
#                     classification, bundle is in sync with src/.
#  - e2e-recognition: full stack WITH the OCR backend; proves server recognition
#                     works on a sample. Kept fast via a cached Docker layer
#                     (paddle never re-installs) + English-only model warm-up.
name: CI

on:
  # Docs-only changes skip this whole pipeline -- nothing here builds or
  # tests markdown. '**/*.md' matches any .md file anywhere in the repo,
  # not just README/CLAUDE.md/docs/** -- those are just examples. A
  # push/PR that touches even one non-doc file still runs everything;
  # paths-ignore only fires when EVERY changed file matches.
  # push is main-only on purpose: a branch push plus its pull_request run
  # built everything twice per commit, and the concurrency group below does
  # not dedupe them because the two events have different refs.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Least-privilege default: every job here only checks out code, runs tests,
# and builds a local Docker image -- none needs to write to the repo, open
# issues/PRs, or publish packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job sets timeout-minutes: without it a hung step runs to the 360
# minute default (15 runs burned 363 minutes each in July 2026).
jobs:
  # Which benchmarks this change can move (scripts/score_closure.py,
  # docs/18-benchmark.md "When the benchmarks run"). On a pull request
  # that touches nothing the replay imports or reads, the benchmark,
  # paired-timing and history jobs are skipped; pushes to main run them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scores: ${{ steps.closure.outputs.scores }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: closure
        uses: ./.github/actions/changes

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install light server deps (no paddle/torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/core.txt
      - name: Verify source dependency inventory
        run: python backend/tools/update_sbom.py --check
      - name: Syntax-check server modules
        run: python -m py_compile backend/server/app.py backend/reading/ocr_backends.py backend/reading/classify.py backend/reading/layout_filter.py backend/analyser-ocr-server.py backend/warmup_models.py backend/tools/benchmark_ocr.py backend/vision/geometry.py backend/reading/model_map.py backend/reading/gpu_detect.py backend/vision/computer_vision.py backend/scoring.py backend/scoring_parts/__init__.py backend/scoring_parts/advisory.py backend/scoring_parts/availability.py backend/scoring_parts/dynamics.py backend/scoring_parts/features.py backend/scoring_parts/page.py backend/scoring_parts/results.py backend/scoring_parts/spatial.py backend/scoring_parts/stats.py backend/scoring_parts/structure.py backend/scoring_parts/style.py backend/scoring_parts/needs.py backend/server/age_band.py backend/reading/detector.py backend/reading/line_recovery.py backend/vision/ink_geometry.py backend/reading/recognizer.py backend/reading/escalation.py backend/config.py backend/server/cache.py backend/languages/tags.py backend/server/scan_slots.py backend/server/capacity.py backend/report/practice_catalog.py backend/server/debug_store.py backend/server/access_api.py backend/languages/registry.py backend/languages/stages.py backend/languages/ladders.py backend/languages/graphemes.py backend/languages/profile.py backend/server/perf.py backend/reading/telugu_reader.py
      - name: Check formatting (black, line-length 79)
        run: black --check --line-length 79 frontend/build_bundle.py backend/*.py backend/server/*.py backend/reading/*.py backend/vision/*.py backend/report/*.py backend/tools/*.py backend/languages/*.py backend/scoring_parts/*.py backend/tests/*.py scripts/coverage_ratchet.py scripts/paired_timing.py scripts/live_timing.py scripts/calibrate.py scripts/score_closure.py
      - name: Lint (pylint, min score 9.0)
        run: |
          pylint --fail-under=9.0 frontend/build_bundle.py \
            backend/analyser-ocr-server.py backend/reading/classify.py \
            backend/reading/ocr_backends.py backend/server/app.py \
            backend/reading/layout_filter.py backend/tools/benchmark_ocr.py \
            backend/warmup_models.py backend/vision/geometry.py \
            backend/reading/model_map.py backend/reading/gpu_detect.py \
            backend/vision/computer_vision.py backend/scoring.py \
            backend/scoring_parts/*.py \
            backend/vision/marked_places.py backend/vision/letter_geometry.py \
            backend/reading/print_hand.py backend/vision/letter_boxes.py \
            backend/server/scan_slots.py backend/server/capacity.py \
            backend/server/scan_worker.py backend/tests/test_scan_worker.py \
            backend/reading/detector.py backend/reading/line_recovery.py \
            backend/vision/ink_geometry.py scripts/ink_geometry_eval.py \
            backend/reading/recognizer.py backend/reading/escalation.py \
            backend/tests/test_escalation.py \
            backend/config.py backend/server/cache.py \
            backend/languages/tags.py backend/tests/test_lang_tags.py \
            backend/server/age_band.py backend/tests/test_age_band.py \
            backend/server/entitlements.py backend/report/report_contract.py backend/server/subscription_admin.py backend/report/compact_reports.py backend/report/comparison_data.py backend/tests/test_comparison_data.py backend/server/upload_limits.py backend/server/daily_limit.py \
            backend/tests/test_subscription_admin.py \
            backend/report/practice_catalog.py backend/tests/test_practice_catalog.py \
            backend/report/contract_schemas.py backend/report/generate_schemas.py backend/tests/test_schemas.py \
            backend/tests/test_backends_classify.py \
            backend/tests/test_server_pipeline.py \
            backend/tests/test_regression_functional.py \
            backend/tests/test_handwriting_only.py \
            backend/tests/test_telugu_not_read.py \
            backend/tests/test_not_writing_page.py \
            backend/reading/telugu_reader.py backend/tests/test_telugu_reader.py \
            scripts/train_guard.py \
            backend/tests/test_layout_filter.py \
            backend/tests/test_line_pieces.py \
            backend/tests/test_sample_page.py \
            backend/tests/test_word_spacing.py \
            backend/tests/test_benchmark.py scripts/benchmark.py \
            backend/tests/test_reading_accuracy.py \
            scripts/profile_benchmark.py backend/tests/test_profile_benchmark.py \
            scripts/live_timing.py backend/tests/test_live_timing.py \
            backend/tests/test_ink_geometry.py \
            backend/tests/test_factor_scores.py scripts/factor_tests.py \
            scripts/calibrate.py backend/tests/test_calibrate.py \
            backend/tests/test_image_formats.py \
            backend/tests/test_scanner_strings.py \
            backend/tests/test_daily_limit.py \
            backend/server/debug_store.py backend/tests/test_debug_store.py \
            backend/server/access_api.py backend/tests/test_access_api.py \
            backend/languages/__init__.py backend/languages/registry.py \
            backend/tests/test_language_packs.py \
            backend/tests/test_letter_facts.py \
            backend/languages/stages.py \
            backend/tests/test_recognition_stages.py \
            backend/languages/ladders.py scripts/rank_stages.py \
            backend/tests/test_ladders.py \
            backend/scoring_parts/needs.py backend/tests/test_factor_needs.py \
            backend/languages/profile.py backend/tests/test_profiles.py \
            backend/languages/graphemes.py backend/tests/test_graphemes.py \
            backend/tests/test_passage_alignment.py \
            scripts/coverage_ratchet.py backend/tests/test_coverage_ratchet.py \
            scripts/complexity.py backend/tests/test_complexity.py \
            backend/server/perf.py backend/tests/test_perf.py \
            scripts/perf_budgets.py backend/tests/test_work_counts.py \
            scripts/paired_timing.py backend/tests/test_paired_timing.py \
            scripts/bench_history.py backend/tests/test_bench_history.py \
            backend/server/report_store.py backend/tests/test_report_store.py
      - name: Verify immutable report dictionary
        run: python backend/report/compact_reports.py --check
      - name: Practice map is current (docs/11-practice-map.md)
        run: python scripts/practice_map.py --check
      - name: Verify generated JSON Schemas
        run: python backend/report/generate_schemas.py --check
      - name: Every language pack resolves and validates
        run: python backend/languages/registry.py --check
      - name: The recognition ladders are what stages.json gives
        run: python scripts/rank_stages.py --check
      # Discovery, not a hand-written list: eight test files once ran in no
      # workflow because nobody added them to the list here (#228).
      - name: Every backend test file runs in some workflow
        run: python scripts/check_tests_run.py --check
      # Under coverage.py with branch coverage (.coveragerc). The per-file
      # table goes to the job summary, the HTML report is an artifact, and
      # coverage-baseline.json is the ratchet (#232,
      # docs/21-performance-and-coverage.md section 6).
      - name: Run server unit + integration tests (every backend/tests/test_*.py)
        run: python -m coverage run --branch -m unittest discover -v -s backend/tests -t .
      - name: Backend coverage report
        run: |
          python -m coverage json
          python -m coverage html
      - name: Upload the backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: |
            coverage/backend.json
            coverage/backend-html/
          if-no-files-found: error
      - name: Backend coverage no lower than coverage-baseline.json
        run: python scripts/coverage_ratchet.py backend coverage/backend.json --check --summary "$GITHUB_STEP_SUMMARY"

  # Real handwriting, replayed: every page's kept reader output goes
  # through this PR's code and must give the scores in expected.json
  # (scripts/benchmark.py, docs/18-benchmark.md). No models needed.
  benchmark:
    needs: changes
    if: needs.changes.outputs.scores == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements/core.txt
      - name: Real pages, every score as expected (each language pack's set)
        run: |
          sets=$(python backend/languages/registry.py --benchmark-sets)
          status=0
          for set in $sets; do
            python scripts/benchmark.py check --set "$set" \
              --results "$RUNNER_TEMP/benchmark-results" || status=1
          done
          exit $status
      # What `benchmark.py update` would write, so a pull request that
      # means to move scores can commit it without running the replay
      # itself (docs/18-benchmark.md).
      - name: Keep the replay's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/benchmark-results
          if-no-files-found: ignore
      # A page read in pieces is measured from the ink (#277). No page
      # of these sets may be: each page's numbers against the thresholds
      # go to the job summary.
      - name: No real page read in pieces
        run: |
          sets=$(python backend/languages/registry.py --benchmark-sets)
          for set in $sets; do
            python scripts/benchmark.py fragments --set "$set" --none
          done
      # Each page through the server's own scan with perf.py recording:
      # a page over a budget in backend/perf/budgets.json fails (#229),
      # and so does any work count above benchmarks/<set>/work.json
      # (#250). The counts this run found are kept as an artifact.
      - name: Every page within its call and CPU budgets, no more work
        run: |
          sets=$(python backend/languages/registry.py --benchmark-sets)
          status=0
          for set in $sets; do
            python scripts/perf_budgets.py check --set "$set" \
              --results "$RUNNER_TEMP/work-counts" || status=1
          done
          exit $status
      - name: Keep the work counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-counts
          path: ${{ runner.temp }}/work-counts
          if-no-files-found: ignore
      - name: Cache the UJI letters for the planted pages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vahini/ujipenchars2.txt
          key: uji-cc56f72f8477e763
      - name: Planted mistakes, no rate worse
        run: python scripts/benchmark.py planted

  # Is this PR's code slower than main's? Main and the PR replay the
  # benchmark pages on the same runner, alternating, seven rounds; the
  # runner's speed cancels out of the ratio (scripts/paired_timing.py,
  # #251, docs/18-benchmark.md). Pull requests that touch backend/ only.
  paired-timing:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.scores == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 2
      - name: Does this pull request change the analyser?
        id: changed
        working-directory: pr
        # HEAD is the PR merged onto main; its first parent is main.
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(backend/|scripts/(benchmark|paired_timing)\.py$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change under backend/: paired timing skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.changed.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: main
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pr/backend/requirements/core.txt
      - if: steps.changed.outputs.run == 'true'
        run: pip install -r pr/backend/requirements/core.txt
      - name: Main and this PR, seven rounds on one runner
        if: steps.changed.outputs.run == 'true'
        run: |
          args=""
          for set in $(python pr/backend/languages/registry.py --benchmark-sets); do
            args="$args --set $set"
          done
          # shellcheck disable=SC2086
          python pr/scripts/paired_timing.py --main main --pr pr \
            --json "$RUNNER_TEMP/paired-timing.json" $args
      - name: Keep every round's times
        if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paired-timing
          path: ${{ runner.temp }}/paired-timing.json
          if-no-files-found: ignore
  # Each per-page function's growth against backend/perf/complexity.json
  # (#230, docs/21-performance-and-coverage.md section 4): synthetic
  # inputs at n, 2n, 4n and 8n, the slope of log CPU time against log n.
  # Slopes only, never times, so runner noise does not fail it.
  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements/core.txt
      - name: Every per-page function grows no faster than declared
        run: python scripts/complexity.py check --summary "$GITHUB_STEP_SUMMARY" --out complexity.md
      - name: Upload the growth table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complexity
          path: complexity.md
          if-no-files-found: warn

  # Slow drift (#254, scripts/bench_history.py): each push to main adds a
  # line per benchmark set to history/<set>.jsonl on the bench-history
  # branch; each pull request is compared with the median of the last ten
  # lines. Accuracy that falls fails; time, memory or work creeping up
  # more than 15% is flagged, since the lines come from different runners
  # and the paired-timing job already compares with main on one runner.
  history:
    needs: changes
    if: needs.changes.outputs.scores == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: bench-history-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write  # a push to main appends to the bench-history branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements/core.txt
      - name: The history so far
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --quiet --depth 1 --branch bench-history "$url" "$RUNNER_TEMP/history"; then
            mkdir -p "$RUNNER_TEMP/history"
            git -C "$RUNNER_TEMP/history" init --quiet -b bench-history
            git -C "$RUNNER_TEMP/history" remote add origin "$url"
          fi
      - name: Measure this commit
        run: |
          mkdir -p "$RUNNER_TEMP/now"
          for set in $(python backend/languages/registry.py --benchmark-sets); do
            # Work counts, once perf_budgets.py writes them (#250).
            python scripts/perf_budgets.py check --set "$set" \
              --results "$RUNNER_TEMP/work" >/dev/null 2>&1 || true
            python scripts/bench_history.py collect --set "$set" \
              --work "$RUNNER_TEMP/work" --out "$RUNNER_TEMP/now/$set.json"
          done
      - name: Against the last ten main runs
        if: github.event_name == 'pull_request'
        run: |
          status=0
          for f in "$RUNNER_TEMP"/now/*.json; do
            python scripts/bench_history.py check \
              --history "$RUNNER_TEMP/history" "$f" || status=1
          done
          exit $status
      - name: Add this commit to the history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd "$RUNNER_TEMP/history"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in "$RUNNER_TEMP"/now/*.json; do
            python "$GITHUB_WORKSPACE/scripts/bench_history.py" append \
              --history . "$f"
          done
          git add history
          git commit --quiet -m "history: ${GITHUB_SHA::7}"
          for try in 1 2 3; do
            if git push --quiet origin HEAD:bench-history; then exit 0; fi
            git pull --quiet --rebase origin bench-history || true
          done
          exit 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Every tests/*.test.mjs (account and worksheet clients, report
      # strings, the OCR client's probes, ...) under c8 (.c8rc.json), with
      # the same summary, artifact and ratchet as the backend (#232).
      - name: Node unit tests under c8 (every tests/*.test.mjs)
        run: npm run coverage:frontend
      - name: Upload the frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend/
          if-no-files-found: error
      - name: Frontend coverage no lower than coverage-baseline.json
        run: python3 scripts/coverage_ratchet.py frontend coverage/frontend/coverage-summary.json --check --summary "$GITHUB_STEP_SUMMARY"
      - name: Changelog fragments are valid
        run: python3 scripts/changelog.py --check
      - name: Build the packed bundle (generated, never committed)
        run: |
          python3 frontend/build_bundle.py
          if git ls-files --error-unmatch frontend/scripts/core/engine.bundle.js >/dev/null 2>&1; then
            echo "::error::engine.bundle.js is committed. It is build output: git rm --cached it."
            exit 1
          fi
          if grep -nE '(src|href)="(scripts/core|scripts/vendor|styles)/[^"]*\?v=' frontend/*.html || grep -nE "@import[^;]*\\?v=" frontend/styles/*.css; then
            echo "::error::A page carries a committed ?v= asset stamp. Run 'python frontend/build_bundle.py --strip'."
            exit 1
          fi
      - name: Browser PDF upload checks
        run: npm run test:pdf
      - name: Unreadable photos (iPhone HEIC in Chrome) are explained, not sent to the store
        run: npm run test:unreadable
      - name: Keep my pages sends nothing unless ticked
        run: npm run test:keep
      - name: The free tier's daily limit is explained, not blamed on the server
        run: npm run test:daily-limit
      - name: A page the server could not read asks for a retry, never a score
        run: npm run test:ocr-unavailable
      - name: A Telugu page the reader could not read is refused, never scored
        run: npm run test:handwriting-not-read
      - name: Picking Telugu sends lang=te and says it is not scored yet
        run: npm run test:telugu-choice
      - name: File and key errors have their own screens; notice pictures come only from the host
        run: npm run test:notice-art
      - name: A maths or science page asks for four lines of English, never a score
        run: npm run test:not-writing-page
      - name: Headless print/handwriting checks
        run: node tests/account-browser.mjs && npm run test:regression:headless
      - name: Practice report and saved progress (#122)
        run: npm run test:practice
      - name: Print in Telugu and Share on WhatsApp
        run: npm run test:language
      - name: The print popup's optional price question and the Request Pro card
        run: npm run test:print-popup
      - name: '"How was the report?" asks once, after ten seconds, and sends one fixed answer'
        run: npm run test:report-feedback
      - name: The shared PDF carries the receipt and the page photo, still two pages
        run: npm run test:share-embed

  # Full stack WITH OCR. The slow part (paddle pip install) is cached as a Docker
  # layer via the GHA cache backend, so warm runs skip it entirely.
  e2e-recognition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build analyser image (cached paddle layer)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/Dockerfile
          tags: vahini/20factor-analyser:local
          load: true
          cache-from: type=gha,scope=analyser
          cache-to: type=gha,mode=max,scope=analyser
      - name: Start stack (reuses prebuilt image; English only)
        env:
          VAHINI_OCR_LANGS: en
        run: docker compose up -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Recognition regression (live backend)
        env:
          VAHINI_BASE_URL: http://localhost:8080
        run: npm run test:recognition
      - name: Dump server logs on failure
        if: failure()
        run: docker compose logs --tail 200 analyser
      - name: Tear down
        if: always()
        run: docker compose down -v
